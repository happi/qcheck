name: qcheck release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Built on Alpine, the binary links musl statically and runs on any
      # x86_64 Linux, whatever C library the CI image has.
      - name: Build a static binary
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -c '
            apk add --no-cache build-base cmake perl linux-headers &&
            cargo build --release --locked -p qcheck-api --bin qcheck'
          cp target/release/qcheck qcheck-x86_64-linux
          ./qcheck-x86_64-linux --help > /dev/null
          sha256sum qcheck-x86_64-linux > qcheck-x86_64-linux.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
              qcheck-x86_64-linux qcheck-x86_64-linux.sha256
