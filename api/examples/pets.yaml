swagger: "2.0"
info:
  title: Pets
  version: "1.0"
basePath: /
consumes: [application/json]
produces: [application/json]

paths:
  /health:
    get:
      operationId: health
      responses:
        200:
          description: The service is up.
          schema:
            type: object
            required: [status]
            properties:
              status: {type: string, enum: [ok]}

  /pets:
    get:
      operationId: listPets
      parameters:
        - {name: limit, in: query, type: integer, format: int32, minimum: 0, maximum: 100}
        - {name: tag, in: query, type: string, maxLength: 10}
      responses:
        200:
          description: A page of pets.
          schema:
            type: array
            items: {$ref: "#/definitions/Pet"}
    post:
      operationId: createPet
      parameters:
        - name: pet
          in: body
          required: true
          schema: {$ref: "#/definitions/NewPet"}
      responses:
        201:
          description: The pet as stored.
          schema: {$ref: "#/definitions/Pet"}
        400:
          description: The pet is not valid.
          schema: {$ref: "#/definitions/Error"}

  /pets/{id}:
    get:
      operationId: getPet
      parameters:
        - {name: id, in: path, required: true, type: integer, format: int64, minimum: 1}
      responses:
        200:
          description: The pet.
          schema: {$ref: "#/definitions/Pet"}
        404:
          description: No pet has this id.
          schema: {$ref: "#/definitions/Error"}
    delete:
      operationId: deletePet
      parameters:
        - {name: id, in: path, required: true, type: integer, format: int64, minimum: 1}
      responses:
        204:
          description: The pet is gone.
        404:
          description: No pet has this id.
          schema: {$ref: "#/definitions/Error"}

definitions:
  NewPet:
    type: object
    required: [name, age]
    properties:
      name: {type: string, minLength: 1, maxLength: 20}
      age: {type: integer, minimum: 0, maximum: 30}
      tag: {type: string, maxLength: 10}
  Pet:
    allOf:
      - $ref: "#/definitions/NewPet"
      - type: object
        required: [id]
        properties:
          id: {type: integer, format: int64, minimum: 1}
  Error:
    type: object
    required: [error]
    properties:
      error: {type: string}
